name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check index.js
          node --check client.js
          node --check search-core.js
          node --check search-pool.js
          node --check worker.js
      # One gate: the runner enumerates every test-*.mjs and exits non-zero on
      # any failure, so a new test can never be left off the list.
      - name: Contracts
        run: node run-tests.mjs
